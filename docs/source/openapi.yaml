  /orders/{order_id}/cancel:
    post:
      operationId: cancelOrder
      summary: Отменить свой заказ с причиной
      description: FB-01. Только владелец и только draft/published. reason обрезается по краям и проверяется на
        5–500 символов. Статус и история с причиной фиксируются одной транзакцией. Повтор canceled с той же причиной
        — 200 без новой истории; иная причина — 409. После assigned обычная отмена запрещена.
      tags:
      - Клиентский API
      x-caller: customer
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/OrderId'
