components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Пользовательский токен для клиентских операций; служебный токен с аудиторией и правами для внутреннего
        контракта.
  parameters:
    OrderId:
      name: order_id
      in: path
      required: true
      schema: *id004
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema: *id004
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
  schemas:
    Payment:
      type: object
      additionalProperties: false
      properties:
        payment_id: *id004
        order_id: *id004
        customer_id: *id004
        amount: &id005
          type: string
          pattern: ^(0|[1-9][0-9]{0,9})\.[0-9]{2}$
          not:
            const: '0.00'
        currency:
          const: BYN
        status:
          enum:
          - pending
          - succeeded
          - failed
          - canceled
        external_op_id:
          type:
          - string
          - 'null'
        confirmation_url:
          type:
          - string
          - 'null'
          format: uri
        created_at:
          type: string
          format: date-time
      required:
      - payment_id
      - order_id
      - customer_id
      - amount
      - currency
      - status
      - external_op_id
      - confirmation_url
      - created_at
    CreatePayment:
      type: object
      additionalProperties: false
      properties:
        order_id: *id004
        customer_id: *id004
        amount: *id005
        currency:
          const: BYN
      required:
      - order_id
      - customer_id
      - amount
      - currency
    PaymentEvent:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          format: uuid
        payment_id: *id004
        order_id: *id004
        amount: *id005
        currency:
          const: BYN
        status:
          enum:
          - succeeded
          - failed
          - canceled
        occurred_at:
          type: string
          format: date-time
      required:
      - event_id
      - payment_id
      - order_id
      - amount
      - currency
      - status
      - occurred_at
    PaymentList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        page: *id004
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - page_size
      - total
    CancelOrder:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
          pattern: ^\S(?:[\s\S]*\S)?$
      required:
      - reason
    EmptyRequest:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    OrderState:
      type: object
      additionalProperties: false
      properties:
        order_id: *id004
        status:
          enum:
          - draft
          - published
          - assigned
          - in_progress
          - awaiting_confirmation
          - completed
          - canceled
        changed_at:
          type: string
          format: date-time
      required:
      - order_id
      - status
      - changed_at
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
          required:
          - code
          - message
          - request_id
      required:
      - error
