  /orders/{order_id}/payment-events:
    post:
      operationId: acceptPaymentEvent
      summary: Принять результат оплаты
      description: Платежи -> заказы, orders:payment-events. order_id пути и тела совпадают. Проверяются платёж,
        заказ, сумма и валюта. Повтор event_id с теми же данными — 204 без второго эффекта; другой состав данных
        или противоречивый конечный статус — 409. Событие сохраняется атомарно с локальным представлением результата.
      tags:
      - Внутренний контракт
      x-caller: service
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/OrderId'
      responses:
        '204':
          description: Результат принят, тело отсутствует
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
