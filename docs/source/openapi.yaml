  /orders/{order_id}/payment-attempts:
    post:
      operationId: startOrderPayment
      summary: Начать или повторить попытку оплаты
      description: FB-02. Пользовательский Bearer, только владелец. Тело {}. Заказы определяют customer_id и сумму
        по выбранному отклику; клиент их не передаёт. Оплата разрешена после выбора исполнителя и до/после выполнения,
        кроме canceled. Компонент заказов вызывает внутренний POST /payments со служебным токеном и тем же ключом.
        При pending новый ключ запрещён; после failed/canceled нужна явная новая попытка и новый ключ. После succeeded
        новый платёж запрещён.
      tags:
      - Клиентский API
      x-caller: customer
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
