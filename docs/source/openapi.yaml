openapi: 3.1.0
info:
  title: Платформа поиска бытовых мастеров и специалистов API
  version: 1.1.0
  description: Проектный контракт. Сервисная и пользовательская авторизация различаются по x-caller; все проверки
    выполняются сервером. Дата и время UTC; деньги — строки с двумя десятичными знаками.
servers:
- url: https://api.example.com/api/v1
  description: Условный адрес проектируемой системы
paths:
  /payments:
    post:
      operationId: createPayment
      summary: Создать платёж
      description: Заказы -> платежи. payments:create. Тот же ключ и тело возвращают прежний платёж; другое тело
        под тем же ключом даёт 409. Одновременные pending и succeeded по одному заказу запрещены. Намерение сохраняется
        до обращения к провайдеру. При неопределённом исходе 503, состояние pending.
      tags:
      - Внутренний контракт
      x-caller: service
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Операция выполнена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не выполнена аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт состояния или ключа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Неподдерживаемый Content-Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Нарушены ограничения данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Временная недоступность; исход внешней операции уточняется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayment'
    get:
      operationId: listPayments
      summary: Список платежей заказа
      description: payments:read. Сортировка created_at DESC, payment_id DESC. total считается после фильтрации
        до пагинации. При отсутствии результатов items=[], total=0.
      tags:
      - Внутренний контракт
      x-caller: service
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: order_id
        in: query
        required: true
        schema: &id004
          type: integer
          minimum: 1
      - &id001
        name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - &id002
        name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - &id003
        name: status
        in: query
        schema:
          enum:
          - pending
          - succeeded
          - failed
          - canceled
      responses:
        '200':
          description: Операция выполнена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не выполнена аутентификация
          content:
            application/json:
              schema:
